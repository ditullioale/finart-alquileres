{% if asistente_disponible %}
<style>
  #aiFab{position:fixed;left:22px;bottom:22px;top:auto;z-index:1200;width:56px;height:56px;border:0;border-radius:50%;
    background:linear-gradient(135deg,rgba(79,124,246,.72),rgba(139,92,246,.72));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;cursor:grab;touch-action:none;opacity:.88;
    box-shadow:0 8px 24px rgba(79,124,246,.30);display:flex;align-items:center;justify-content:center;
    transition:box-shadow .15s ease, opacity .15s ease}
  #aiFab:hover{opacity:1;box-shadow:0 12px 30px rgba(79,124,246,.45)}
  #aiFab.ai-drag{cursor:grabbing;opacity:1}
  #aiFab svg{width:26px;height:26px;pointer-events:none}
  #aiPanel{position:fixed;left:22px;bottom:90px;z-index:1200;width:370px;max-width:calc(100vw - 28px);
    height:540px;max-height:calc(100vh - 130px);background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid rgba(219,228,240,.7);border-radius:16px;
    box-shadow:0 18px 50px rgba(18,38,63,.24);display:flex;flex-direction:column;overflow:hidden}
  #aiPanel[hidden]{display:none}
  .ai-head{background:linear-gradient(135deg,rgba(18,38,63,.86),rgba(40,64,126,.86));color:#fff;padding:12px 14px;
    display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
  .ai-head .ai-x{margin-left:auto;background:transparent;border:0;color:#cfe0f5;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
  .ai-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px;background:transparent}
  .ai-b{max-width:88%;padding:9px 12px;border-radius:13px;white-space:pre-wrap;line-height:1.45;font-size:13.5px}
  .ai-b.u{align-self:flex-end;background:#2f6fed;color:#fff;border-bottom-right-radius:4px}
  .ai-b.a{align-self:flex-start;background:#eef3fb;color:#12263f;border-bottom-left-radius:4px}
  .ai-b.err{background:#fdecec;color:#9c2020}
  .ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0;background:transparent}
  .ai-chip{border:1px solid #cfe0f5;background:#fff;color:#2f6fed;border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer}
  .ai-chip:hover{background:#eef3fb}
  .ai-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(230,236,245,.7);align-items:flex-end;background:rgba(255,255,255,.35)}
  .ai-form textarea{flex:1;resize:none;border:1px solid #cfd8e3;border-radius:10px;padding:9px 11px;
    font-family:inherit;font-size:13.5px;max-height:90px;outline:none}
  .ai-form textarea:focus{border-color:#2f6fed}
  .ai-form .ai-send{background:#2f6fed;color:#fff;border:0;border-radius:10px;width:40px;height:40px;
    cursor:pointer;font-size:17px;flex:0 0 auto}
  .ai-form .ai-send:disabled{opacity:.5;cursor:default}
</style>
<button id="aiFab" title="Preguntá al asistente" aria-label="Abrir asistente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>
<div id="aiPanel" role="dialog" aria-label="Asistente" hidden>
  <div class="ai-head">🤖 Asistente <button type="button" class="ai-x" id="aiClose" aria-label="Cerrar">&times;</button></div>
  <div class="ai-body" id="aiBody"></div>
  <div class="ai-chips">
    <button type="button" class="ai-chip">¿Quién me debe?</button>
    <button type="button" class="ai-chip">¿Qué contratos vencen pronto?</button>
    <button type="button" class="ai-chip">¿Cuánto cobré este mes?</button>
  </div>
  <form class="ai-form" id="aiForm">
    <textarea id="aiInput" rows="1" placeholder="Preguntá algo…"></textarea>
    <button type="submit" class="ai-send" id="aiSend" aria-label="Enviar">➤</button>
  </form>
</div>
<script>
(function(){
  var fab=document.getElementById('aiFab'), panel=document.getElementById('aiPanel');
  var body=document.getElementById('aiBody'), form=document.getElementById('aiForm');
  var input=document.getElementById('aiInput'), send=document.getElementById('aiSend');
  var saludado=false, POS='ai_fab_pos';

  function clamp(x,y){ return [Math.max(6,Math.min(x,window.innerWidth-62)),
                               Math.max(6,Math.min(y,window.innerHeight-62))]; }
  function ponerFab(x,y){ var c=clamp(x,y); fab.style.left=c[0]+'px'; fab.style.top=c[1]+'px'; fab.style.bottom='auto'; }
  (function(){
    try{ var p=JSON.parse(localStorage.getItem(POS)); if(p&&p.x!=null){ ponerFab(p.x,p.y); return; } }catch(e){}
    ponerFab(22, window.innerHeight-78);   // por defecto: abajo a la izquierda
  })();

  function posicionarPanel(){
    var r=fab.getBoundingClientRect();
    var pw=Math.min(370, window.innerWidth-28), ph=panel.offsetHeight||540;
    var left=Math.max(8, Math.min(r.left, window.innerWidth-pw-8));
    var top=r.top-ph-10;                       // preferir arriba del globito
    if(top<8){ top=Math.min(r.bottom+10, window.innerHeight-ph-8); }
    if(top<8) top=8;
    panel.style.left=left+'px'; panel.style.top=top+'px'; panel.style.bottom='auto';
  }
  function burbuja(txt, tipo){ var d=document.createElement('div'); d.className='ai-b '+tipo;
    d.textContent=txt; body.appendChild(d); body.scrollTop=body.scrollHeight; return d; }
  function abrir(){ panel.hidden=false; posicionarPanel();
    if(!saludado){ burbuja('¡Hola! Preguntame lo que quieras sobre tus alquileres: quién debe, cuándo vence un contrato, cuánto cobraste este mes…','a'); saludado=true; }
    input.focus(); }
  function cerrar(){ panel.hidden=true; }
  function toggle(){ panel.hidden ? abrir() : cerrar(); }

  // Arrastre del globito (distingue clic de mover; guarda la posición).
  var down=false, movido=false, sx=0, sy=0, ox=0, oy=0;
  fab.addEventListener('pointerdown', function(e){
    down=true; movido=false; sx=e.clientX; sy=e.clientY;
    var r=fab.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top;
    try{ fab.setPointerCapture(e.pointerId); }catch(_e){}
    fab.classList.add('ai-drag');
  });
  fab.addEventListener('pointermove', function(e){
    if(!down) return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>5) movido=true;
    if(movido){ ponerFab(e.clientX-ox, e.clientY-oy); if(!panel.hidden) posicionarPanel(); }
  });
  fab.addEventListener('pointerup', function(){
    if(!down) return; down=false; fab.classList.remove('ai-drag');
    if(movido){ var r=fab.getBoundingClientRect();
      try{ localStorage.setItem(POS, JSON.stringify({x:r.left,y:r.top})); }catch(e){} }
    else { toggle(); }
  });
  window.addEventListener('resize', function(){
    var r=fab.getBoundingClientRect(); ponerFab(r.left,r.top); if(!panel.hidden) posicionarPanel(); });

  document.getElementById('aiClose').addEventListener('click', cerrar);
  function preguntar(txt){ if(!txt.trim()) return; burbuja(txt,'u'); input.value=''; input.style.height='auto';
    send.disabled=true; var p=burbuja('Pensando…','a');
    fetch('/asistente/preguntar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pregunta:txt})})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j.ok){ p.textContent=j.respuesta||'Sin respuesta.'; }
        else { p.textContent='⚠️ '+(j.error||'No se pudo responder.'); p.classList.add('err'); }
        send.disabled=false; body.scrollTop=body.scrollHeight; })
      .catch(function(){ p.textContent='⚠️ Error de conexión.'; p.classList.add('err'); send.disabled=false; }); }
  form.addEventListener('submit', function(e){ e.preventDefault(); preguntar(input.value); });
  document.querySelectorAll('#aiPanel .ai-chip').forEach(function(c){
    c.addEventListener('click', function(){ preguntar(c.textContent); }); });
  input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
  input.addEventListener('input', function(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,90)+'px'; });
})();
</script>
{% endif %}
