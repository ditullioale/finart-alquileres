<script>
// Vista compacta / cómoda: alterna densidad de tablas y la recuerda.
window.toggleDensidad = function(){
  var on = document.body.classList.toggle('compact');
  try{ localStorage.setItem('densidad', on ? 'compact' : 'normal'); }catch(e){}
  var l = document.getElementById('densLbl');
  if(l) l.textContent = on ? 'Vista cómoda' : 'Vista compacta';
};
(function(){
  var l = document.getElementById('densLbl');
  if(l) l.textContent = document.body.classList.contains('compact') ? 'Vista cómoda' : 'Vista compacta';
})();
// Ventanita "Ver gas": muestra la deuda de una cuenta sin salir de la página.
(function(){
  var ov = document.getElementById('gasModal');
  if(!ov) return;
  function fmt(n){ return Number(n||0).toFixed(2).replace(/\d(?=(\d{3})+\.)/g,'$&X').replace('.',',').replace(/X/g,'.'); }
  function fecha(iso){ if(!iso) return '—'; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  window.verGas = function(cuenta){
    document.getElementById('gm-cuenta').textContent = 'Cuenta Litoral Gas: ' + cuenta;
    document.getElementById('gm-body').innerHTML = 'Cargando…';
    ov.removeAttribute('hidden');
    fetch('/gas/estado?cuenta=' + encodeURIComponent(cuenta))
      .then(function(r){ return r.json(); })
      .then(function(j){
        var b = document.getElementById('gm-body');
        if(!j.ok){
          b.innerHTML = '<p style="color:var(--muted)">Todavía no hay datos de gas para esta cuenta. Corré el robot para actualizar.</p>';
          return;
        }
        if(j.tiene_deuda){
          var hoy = new Date().toISOString().slice(0,10);
          var fact = (j.facturas||[]);
          var filas = fact.map(function(f){
            var vencida = f.venc && f.venc < hoy;
            var col = vencida ? 'var(--err)' : 'var(--txt)';
            var tag = vencida ? ' <span style="color:var(--err);font-size:11px;font-weight:700">VENCIDA</span>' : '';
            return '<tr>' +
              '<td style="padding:5px 6px;font-size:12.5px;color:var(--muted)">N° ' + (f.num||'—') + '</td>' +
              '<td style="padding:5px 6px;font-size:13px;color:'+col+'">' + fecha(f.venc) + tag + '</td>' +
              '<td style="padding:5px 6px;font-size:13px;text-align:right;font-weight:600;color:'+col+'">$ ' + fmt(f.imp) + '</td></tr>';
          }).join('');
          b.innerHTML =
            '<div style="background:var(--errbg);border:1px solid #f0b4b4;border-radius:10px;padding:10px 12px;margin-bottom:10px">' +
            '<span style="font-size:13px;color:#9c2020;font-weight:600">DEBE </span>' +
            '<span style="font-size:22px;font-weight:800;color:var(--err)">$ ' + fmt(j.deuda_total) + '</span>' +
            '<span style="font-size:12.5px;color:var(--muted)"> · ' + fact.length + ' factura(s)</span></div>' +
            '<div style="font-size:12px;color:var(--muted);margin-bottom:2px">Facturas pendientes (de la más vieja a la más nueva):</div>' +
            '<table style="width:100%;border-collapse:collapse"><thead><tr>' +
            '<th style="text-align:left;font-size:11px;color:var(--muted);padding:2px 6px">Comprobante</th>' +
            '<th style="text-align:left;font-size:11px;color:var(--muted);padding:2px 6px">Vencimiento</th>' +
            '<th style="text-align:right;font-size:11px;color:var(--muted);padding:2px 6px">Saldo</th>' +
            '</tr></thead><tbody>' + filas + '</tbody></table>';
        } else {
          b.innerHTML =
            '<div style="background:var(--okbg);border:1px solid #a9dcbb;border-radius:10px;padding:14px;text-align:center">' +
            '<div style="font-size:20px;font-weight:700;color:#14663a">✓ Al día</div>' +
            '<div style="font-size:13px;color:var(--muted);margin-top:2px">Sin facturas pendientes</div></div>';
        }
        if(j.actualizado){
          b.innerHTML += '<div style="font-size:12px;color:var(--muted);margin-top:10px">Actualizado: ' + j.actualizado + '</div>';
        }
      }).catch(function(){
        document.getElementById('gm-body').innerHTML = '<p style="color:var(--err)">No se pudo cargar el estado de gas.</p>';
      });
  };
  ov.addEventListener('click', function(e){ if(e.target === ov) ov.setAttribute('hidden',''); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !ov.hasAttribute('hidden')) ov.setAttribute('hidden',''); });
  document.querySelectorAll('.js-vergas').forEach(function(btn){
    btn.addEventListener('click', function(){ verGas(btn.dataset.cuenta); });
  });
})();

// Toast dinámico (desde JS): showToast('mensaje', 'ok'|'error')
window.showToast = function(msg, type){
  var cont = document.getElementById('toasts');
  if(!cont){ cont = document.createElement('div'); cont.id = 'toasts'; cont.className = 'toasts'; document.body.appendChild(cont); }
  var t = document.createElement('div');
  t.className = 'toast ' + (type === 'error' ? 'error' : 'ok');
  var ic = document.createElement('span'); ic.className = 't-ic';
  ic.innerHTML = (type === 'error')
    ? '<svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>'
    : '<svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  var m = document.createElement('span'); m.className = 't-msg'; m.textContent = msg;
  var x = document.createElement('button'); x.className = 't-x'; x.setAttribute('aria-label','Cerrar');
  x.textContent = '✕'; x.onclick = function(){ t.remove(); };
  t.appendChild(ic); t.appendChild(m); t.appendChild(x); cont.appendChild(t);
  setTimeout(function(){ t.classList.add('hide'); setTimeout(function(){ t.remove(); }, 350); }, 5000);
};
// Toasts (de mensajes flash del servidor): se desvanecen solos a los ~5s.
document.querySelectorAll('#toasts .toast').forEach(function(t, i){
  setTimeout(function(){ t.classList.add('hide'); setTimeout(function(){ t.remove(); }, 350); }, 5000 + i*400);
});
// Tablas usables en mobile: envolver cada tabla en un contenedor con scroll.
document.querySelectorAll('table.grid').forEach(function(tb){
  if (tb.parentElement && tb.parentElement.classList.contains('table-wrap')) return;
  var w = document.createElement('div'); w.className = 'table-wrap';
  tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
});
// Filtro instantáneo de listas: escribís y se ocultan las filas que no coinciden,
// sin recargar la página. Enter/submit sigue funcionando (búsqueda del servidor).
document.querySelectorAll('input[data-live-filter]').forEach(function(inp){
  var tbody = document.querySelector(inp.getAttribute('data-live-filter'));
  if(!tbody) return;
  function apply(){
    var q = (inp.value || '').trim().toLowerCase();
    var visibles = 0, total = 0;
    tbody.querySelectorAll('tr').forEach(function(tr){
      if(tr.dataset.noFilter !== undefined) return;
      total++;
      var match = tr.textContent.toLowerCase().indexOf(q) !== -1;
      tr.style.display = match ? '' : 'none';
      if(match) visibles++;
    });
    var vacio = tbody.querySelector('tr[data-live-empty]');
    if(!vacio && total){
      vacio = document.createElement('tr');
      vacio.setAttribute('data-live-empty','');
      vacio.setAttribute('data-no-filter','');
      var td = document.createElement('td');
      td.className = 'empty'; td.colSpan = 12;
      td.textContent = 'Sin resultados para tu búsqueda.';
      vacio.appendChild(td); tbody.appendChild(vacio);
    }
    if(vacio) vacio.style.display = (q && visibles === 0) ? '' : 'none';
  }
  inp.addEventListener('input', apply);
  // Evitar recargar al apretar Enter cuando se usa el filtro en vivo.
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') e.preventDefault(); });
});
// Feedback al enviar formularios: deshabilita el botón y muestra "Guardando…".
document.addEventListener('submit', function(e){
  var form = e.target;
  if (form.dataset.noBusy !== undefined) return;
  if ((form.method || '').toLowerCase() !== 'post') return;  // no en búsquedas/filtros (GET)
  // Esperar un tick para respetar validaciones/confirmaciones que cancelan el submit.
  setTimeout(function(){
    if (e.defaultPrevented) return;
    var btn = form.querySelector('button[type="submit"], button:not([type])');
    if (btn && !btn.disabled){
      btn.dataset.label = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('is-busy');
      btn.innerHTML = '<span class="spin"></span> Guardando…';
    }
  }, 0);
}, true);
</script>
