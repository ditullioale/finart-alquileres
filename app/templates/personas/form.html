{% extends "base.html" %}
{% block title %}{{ 'Editar' if persona.id else 'Nueva' }} persona{% endblock %}
{% block content %}
<div class="pagehead"><h1>{{ 'Editar' if persona.id else 'Nueva' }} persona</h1></div>

<form method="post" class="cardform">
  <div class="grid2">
    <div class="full"><label>Nombre y apellido *</label>
      <input name="nombre" value="{{ persona.nombre or '' }}" required autofocus></div>
    <div><label>DNI</label><input name="dni" id="dni" value="{{ persona.dni or '' }}"></div>
    <div><label>CUIT / CUIL</label>
      <input name="cuit" id="cuit" value="{{ persona.cuit or '' }}">
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">
        <span class="hint" style="margin:0">Calcular desde el DNI:</span>
        <button type="button" class="btn sec sm" onclick="calcularCuit('M')">Varón</button>
        <button type="button" class="btn sec sm" onclick="calcularCuit('F')">Mujer</button>
      </div>
      <span id="cuit-hint" class="hint"></span></div>
    <div class="full"><label>Domicilio</label>
      <input name="domicilio" value="{{ persona.domicilio or '' }}"></div>
    <div><label>Localidad</label><input name="localidad" value="{{ persona.localidad or '' }}"></div>
    <div><label>Condición IVA</label>
      <input name="cond_iva" value="{{ persona.cond_iva or 'Consumidor Final' }}"></div>
    <div><label>Teléfono</label>
      <input name="telefono" id="telefono" value="{{ persona.telefono or '' }}"
             placeholder="Ej: 11 2345-6789">
      <span id="tel-check" class="hint"></span></div>
    <div><label>Email</label><input name="email" value="{{ persona.email or '' }}"></div>
  </div>

  <div class="checks">
    <label class="chk"><input type="checkbox" name="es_propietario"
      {{ 'checked' if persona.es_propietario }}> Es propietario</label>
    <label class="chk"><input type="checkbox" name="es_inquilino"
      {{ 'checked' if persona.es_inquilino }}> Es inquilino</label>
  </div>

  <label>Observaciones</label>
  <textarea name="observaciones" rows="3">{{ persona.observaciones or '' }}</textarea>

  <div class="formbtns">
    <button class="btn" type="submit">Guardar</button>
    <a class="btn sec" href="{{ url_for('personas.listar') }}">Cancelar</a>
  </div>
</form>

<script>
// Réplica en JS de normalizar_whatsapp() (app/utils.py) para dar feedback
// inmediato al cargar el teléfono, sin esperar a guardar.
function normalizarWhatsapp(tel) {
  let d = (tel || '').trim().replace(/\.0+$/, '').replace(/\D/g, '');
  if (!d) return null;
  if (d.startsWith('549')) d = d.slice(3);
  else if (d.startsWith('54')) d = d.slice(2);
  if (d.startsWith('0')) d = d.slice(1);
  if (d.length === 12) {
    for (const i of [2, 3, 4]) {
      if (d.slice(i, i + 2) === '15') { d = d.slice(0, i) + d.slice(i + 2); break; }
    }
  }
  if (d.length === 11 && d.startsWith('9')) d = d.slice(1);
  if (d.length !== 10) return null;
  return '549' + d;
}

const telInput = document.getElementById('telefono');
const telCheck = document.getElementById('tel-check');

function actualizarCheck() {
  const valor = telInput.value.trim();
  if (!valor) { telCheck.textContent = ''; return; }
  const numero = normalizarWhatsapp(valor);
  if (numero) {
    telCheck.textContent = '✅ Válido para WhatsApp (+' + numero + ')';
    telCheck.style.color = 'var(--ok)';
  } else {
    telCheck.textContent = '⚠️ Falta el código de área o el número está incompleto';
    telCheck.style.color = 'var(--err)';
  }
}
telInput.addEventListener('input', actualizarCheck);
actualizarCheck();

// Calcular CUIT desde el DNI: no se puede derivar el prefijo (20 varón /
// 27 mujer) del DNI solo -- depende del sexo registrado en AFIP, que no
// guardamos -- así que lo elegís vos acá con el botón y se arma el CUIT
// con el algoritmo oficial (módulo 11, coeficientes 5,4,3,2,7,6,5,4,3,2),
// incluido el caso especial: si el resto da 1, el prefijo pasa a 23 y el
// verificador es 9 (venía de varón) o 4 (venía de mujer). Solo llena el
// campo -- se guarda recién cuando confirmás y le das Guardar.
function calcularCuit(sexo) {
  const hint = document.getElementById('cuit-hint');
  const dni = (document.getElementById('dni').value || '').replace(/\D/g, '');
  if (dni.length !== 7 && dni.length !== 8) {
    hint.textContent = 'Cargá primero un DNI válido (7 u 8 dígitos) y probá de nuevo.';
    hint.style.color = 'var(--err)';
    return;
  }
  const dni8 = dni.padStart(8, '0');
  const prefijo = sexo === 'M' ? '20' : '27';
  const base = prefijo + dni8;
  const coefs = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
  let suma = 0;
  for (let i = 0; i < 10; i++) suma += parseInt(base[i], 10) * coefs[i];
  const resto = suma % 11;
  let prefFinal = prefijo, verif;
  if (resto === 0) verif = 0;
  else if (resto === 1) { prefFinal = '23'; verif = sexo === 'M' ? 9 : 4; }
  else verif = 11 - resto;
  document.getElementById('cuit').value = prefFinal + '-' + dni8 + '-' + verif;
  hint.textContent = 'Calculado a partir del DNI (' + (sexo === 'M' ? 'varón' : 'mujer') +
    '). Revisalo antes de guardar -- no confirma que sea el CUIT real de la persona, solo hace la cuenta.';
  hint.style.color = 'var(--muted)';
}
</script>
{% endblock %}
