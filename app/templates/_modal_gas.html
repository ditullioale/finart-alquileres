      <h3>Estado de gas</h3>
      <button type="button" class="modal-x" aria-label="Cerrar" onclick="document.getElementById('gasModal').setAttribute('hidden','')">✕</button>
    </div>
    <p class="modal-sub" id="gm-cuenta"></p>
    <div id="gm-body" style="font-size:15px"></div>
    <div class="modal-btns">

    </div>
  </div>
